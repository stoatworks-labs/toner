    <main id="demo">
      <noscript>
        <h1>Toner</h1>
        <p>
          An FFGL effect that runs your clip through a xerographic engine up to
          eight times a frame, each copy made from the last: optics, an
          auto-exposure that throws the background away, a steep photoconductor,
          development that follows the electric field above the latent image
          rather than the image itself, a toner supply that runs short, and a
          drum whose defects repeat down the page. Greys collapse to paper or
          toner, wide solids go hollow while thin lines print full, the page
          runs out part-way down, and the skew drifts a bit further with every
          generation. Much like the office copier, minus the paper jams.
        </p>
        <p>
          This demo runs the plugin's shaders in your browser, so it needs
          JavaScript and WebGL2. The plugin itself, its source and its downloads
          are on
          <a href="https://github.com/stoatworks-labs/toner">its repository</a>.
        </p>
